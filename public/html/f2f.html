<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Calendar </title>
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/general.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Mogra&family=Noto+Sans+TC:wght@100..900&family=Tomorrow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

</head>

<body>
    <div id="newnav"></div>
    <!-- <div class="sep-bar-10"></div> -->
    <!-- <div class="sep-line"></div> -->

    <div class="content-container">
        <h1> 預約面談</h1>
    </div>

    <div class="main-container">
        <div class="fullwidth-container" style="padding:10px">
            <div class="fixedbox">

                <div class="main-container-row" style="justify-content: space-evenly;">
                    <div>面談日期</div>
                    <div>可預約時段</div>
                    <div>預約狀態</div>
                </div>

                <div class="main-container-row">
                    <div class="datelist">2 July 2025</div>
                    <div class="starttime">15:00</div>-
                    <div class="endtime"> 17:00</div>
                    <button class="bookinglist">可預約</button>
                </div>

                <div class="main-container-row">
                    <div class="datelist">3 July 2025</div>
                    <div class="starttime">18:00</div>-
                    <div class="endtime"> 20:00</div>
                    <button class="bookinglist">可預約</button>
                </div>

                <div class="main-container-row">
                    <div class="datelist">7 July 2025</div>
                    <div class="starttime">15:00</div>-
                    <div class="endtime"> 17:00</div>
                    <button class="bookinglist unlock" disabled="true">已約滿</button>
                </div>

            </div>
        </div>
        <div class="fullwidth-container">
                <div class="content-container">
                    <div style="font-weight:bold; font-size: 1.5em; text-decoration: underline;"> 預約詳情</div>
                </div>
            <div id="bookingbox" class="fixedbox">
                <div class="content-container">
                    <div>日期：<input id="meetingdate" type="text" disabled="true"></div>
                    <div>時間：<select id="available-time">
                        </select>
                    </div>
                </div>
                <div class="content-container">
                    <button class="mybtn-grid">提交</button>
                </div>
            </div>

            <script>

                $('.bookinglist').click(function (e) {
                    $('#bookingbox div').show();
                    $('#available-time').empty();
                    const parent = $(this).closest('.main-container-row')
                    console.log(parent.html());
                    const date = parent.find('.datelist').html();
                    const starttime = parent.find('.starttime').html();
                    console.log(starttime);
                    console.log("Date: " + date);
                    $('#meetingdate').val(date);

                    // number of timeslots = 6

                    const timesplit = starttime.split(':');
                    console.log(timesplit);
                    var hour = parseInt(timesplit[0]);
                    var min = parseInt(timesplit[1]) - 20;
                    console.log(min);
                    for (var i = 0; i < 6; i++) {
                        if (min < 40) {
                            min = min + 20;
                        } else {
                            if (min === 60) {
                                min = 0;
                            } else {
                                min = min + 20 - 60;
                            }
                            hour += 1;
                        }
                        console.log(min)
                        if (min === 0) {
                            var html = `<option> ${hour}:00 </option>`
                        } else {
                            var html = `<option> ${hour}:${min}</option>`;
                        }

                        document.getElementById('available-time').insertAdjacentHTML('beforeend', html);
                    }

                });

            </script>
    <script src="/js/new_navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>

</body>

</html>
