<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title> Sports Consultancy </title>
    <style>


        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            width: 80%;
            max-width: 400px;
            margin: 20px auto;
            /* Center the calendar */
        }

        .day {
            border: 1px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50px;
            background-color: #f9f9f9;
            color: black;
            /* Change text color for better visibility */
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .header input {
            width: 20vw;
            margin: 20px;
            /* Add space between elements */
        }
    </style>
</head>

<body style="background-color: rgba(6, 0, 92, 1); color:white">

    <div class="navbar">
        <div class="logo">
            <img src="icon.webp" alt="Company Icon">
        </div>
        <h1 style="flex:20"> SOOPERSports Consulting Agency</h1>
        <a href="#home">Home</a>
        <div class="dropdownList">
            <a class="list-toggle" href="#services">Services</a>
            <div class="dropdown-content">
                <a href="#service1">Service 1</a>
                <a href="#service2">Service 2</a>
            </div>
        </div>
        <a href="#contact">Contact</a>
    </div>

    <div class="row rowBackground" style="height:50vh">

        <div class="header">
            <h1>Calendar</h1>
            <input id="month" type="month">
            <button class="mybtn" id="generate">Select month</button>
        </div>
        <div class="calendar" id="calendar"></div>
    </div>

    <script>
        function generateCalendar(startDay,month) {
            const calendar = document.getElementById('calendar');
            calendar.innerHTML = ''; // Clear previous calendar

            const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            daysOfWeek.forEach(day => {
                const dayBox = document.createElement('div');
                dayBox.className = 'day mybtn';
                dayBox.textContent = day; // Set the day name
                calendar.appendChild(dayBox);
            });

            // Fill in the calendar
            for (let i = 0; i < 42; i++) { // 6 rows of 7 days
                const dayBox = document.createElement('button');
                dayBox.className = 'day mybtn';

                if (i >= startDay && i < startDay + 31 && (i - startDay + 1) <= 31) {
                    dayBox.textContent = i - startDay + 1; // Fill in the day of the month
  dayBox.id = (i - startDay + 1) + '-' + month;
                }

                calendar.appendChild(dayBox);
            }
        }

        // Default calendar (e.g., for March 2023, starting on Wednesday)
        generateCalendar(3); // Adjust starting day (0-Sunday, 1-Monday, etc.)

        document.getElementById('generate').addEventListener('click', function () {
    const monthInput = document.getElementById('month').value; // Get value from the month input
    const [year, month] = monthInput.split('-'); // Split into year and month
    let startDay;

    if (month === '01' && year === '2025') { 
        startDay = 3; // Example start day
    } else if (month === '02' && year === '2025') { // February 2025
        startDay = 6; // Example start day
    } else if (month === '03' && year === '2025') { // March 2025
        startDay = 6; // Example start day
    } else if (month === '04' && year === '2025') { // April 2025
        startDay = 2; // Example start day
    } else if (month === '05' && year === '2025') { // May 2025
        startDay = 4; // Example start day
    } else if (month === '06' && year === '2025') { // June 2025
        startDay = 0; // Example start day
    } else if (month === '07' && year === '2025') { // July 2025
        startDay = 2; // Example start day
    } else if (month === '08' && year === '2025') { // August 2025
        startDay = 5; // Example start day
    } else if (month === '09' && year === '2025') { // September 2025
        startDay = 1; // Example start day
    } else if (month === '10' && year === '2025') { // October 2025
        startDay = 3; // Example start day
    } else if (month === '11' && year === '2025') { // November 2025
        startDay = 4; // Example start day
    } else if (month === '12' && year === '2025') { // December 2025
        startDay = 6; // Example start day
    } else {
        alert('Please select a valid month.');
        return;
    }

    generateCalendar(startDay,month);
});
    </script>

</body>

</html>
