<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/general.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Mogra&family=Noto+Sans+TC:wght@100..900&family=Tomorrow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <style>
        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <nav id="newnav"></nav>
    <div class="sep-bar-10"></div>

    <div class="content-container">
        <div class="sep-bar-10"></div>
        <h1>預約與導師面談</h1>
    </div>

    <div class="content-container">
        <div class="container mt-5">
            <div class="row mb-3">
                <div class="col-md-3">
                    <label for="instructorSelect">導師</label>
                    <select id="instructorSelect" class="form-control">
                        <option value="">選擇導師</option>
                        <option value="me">蘇慧音</option>
                        <option value="Instructor 2">導師2</option>
                        <option value="Instructor 3">導師3</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="monthSelect">月份</label>
                    <select id="monthSelect" class="form-control">
                        <option value="">選擇月份</option>
                        <option value="January">January</option>
                        <option value="February">February</option>
                        <option value="March">March</option>
                        <option value="April">April</option>
                        <option value="May">May</option>
                        <option value="June">June</option>
                        <option value="July">July</option>
                        <option value="August">August</option>
                        <option value="September">September</option>
                        <option value="October">October</option>
                        <option value="November">November</option>
                        <option value="December">December</option>
                    </select>
                </div>
            </div>

            <table class="table">
                <thead>
                    <tr>
                        <th>Instructor</th>
                        <th>Month</th>
                        <th>Date</th>
                        <th>Timeslots</th>
                        <th>Booking Availability</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr data-instructor="me" data-month="January">
                        <td>Instructor 1</td>
                        <td>January</td>
                        <td>01/01/2025</td>
                        <td>10:00 AM - 11:00 AM</td>
                        <td>Available</td>
                    </tr>
                    <tr data-instructor="Instructor 2" data-month="February">
                        <td>Instructor 2</td>
                        <td>February</td>
                        <td>02/02/2025</td>
                        <td>11:00 AM - 12:00 PM</td>
                        <td>Unavailable</td>
                    </tr>
                    <tr data-instructor="Instructor 1" data-month="March">
                        <td>Instructor 1</td>
                        <td>March</td>
                        <td>03/03/2025</td>
                        <td>01:00 PM - 02:00 PM</td>
                        <td>Available</td>
                    </tr>
                    <!-- Add more rows as needed -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#instructorSelect, #monthSelect').change(function () {
                const selectedInstructor = $('#instructorSelect').val();
                const selectedMonth = $('#monthSelect').val();

                $('#tableBody tr').each(function () {
                    const instructor = $(this).data('instructor');
                    const month = $(this).data('month');

                    const showRow = (!selectedInstructor || instructor === selectedInstructor) &&
                        (!selectedMonth || month === selectedMonth);

                    $(this).toggle(showRow);
                });
            });
        });
    </script>

    <script src="../js/new_navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>

</body>

</html>
