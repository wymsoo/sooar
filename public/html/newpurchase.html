<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> New Purchase </title>
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/general.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Mogra&family=Noto+Sans+TC:wght@100..900&family=Tomorrow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>

    <div id="newnav"></div>
    <div class="sep-bar-10"></div>
    <!-- <div class="sep-line"></div> -->


    <div class="block-container" style="margin-left: 20px;">
        <div>
            <div class="sep-bar-10"></div>
            <h1> 購買顧問服務</h1>
        </div>
    </div>

    <div class="main-container">
        <div id="infoblock" class="block-container">
            <div class="content-container">
                <div>
                    <h3> 每個階段解鎖：先購買第一階段———整體評價</h3>
                    <div> 三個階段分為: </div>
                    <div class="sep-bar-10"></div>
                    <div>1）整體評價 </div>
                    <div>2a）技術分析+訓練計畫建議 </div>
                    <div>2b）影片旁述 </div>
                    <div>3）網上面談</div>
                </div>
                <div class="sep-bar-10"></div>
                <div> 想有一個簡單的評價，可以選擇此項服務。每個階段需順序解鎖（2a 和 2b 可以同時解鎖）。解鎖後可立刻觀看有關內容。</div>
                <div class="sep-bar-10"></div>
                <button class="mybtn" onclick="showPurchaseForm()"> 先購買第一階段</button>
            </div>
            <div class="content-container">
                <div>
                    <h3> 購買整套技術研究分析服務</h3>
                    <div>包括第一階段和第二階段：</div>
                    <div class="sep-bar-10"></div>
                    <div>1）整體評價</div>
                    <div>2a）技術分析+訓練計畫建議</div>
                    <div>2b）影片旁述</div>
                </div>
                <div class="sep-bar-10"></div>
                <button class="mybtn" onclick="showPurchaseForm()"> 購買</button>
            </div>
            <div class="content-container">
                <div>
                    <h3>購買整套技術研究分析服務+網上面談</h3>
                    <div>包括第一至三階段：</div>
                    <div class="sep-bar-10"></div>
                    <div>1）整體評價</div>
                    <div>2a）技術分析+訓練計畫建議</div>
                    <div>2b）影片旁述</div>
                    <div>3）網上面談（需等待報告出後，進行預約）</div>
                </div>
                <div class="sep-bar-10"></div>
                <button class="mybtn" onclick="showPurchaseForm()"> 購買</button>
            </div>
        </div>

        <div id="newPurchaseForm" class="fixedbox2" style="border: 2px solid black; border-radius: 5px; display:none">
            <div class="content-container">
                <h3>你的訂單</h3>

                <form>
                    <label for="productname">1. 訂購服務</label>
                    <div>
                        <div class="sep-bar-10"></div><select id="productname">
                            <option value="single"> 整體評價 </option>
                            <option value="set2"> 選項2 </option>
                            <option value="set3"> 選項3</option>
                        </select>
                    </div>

                    <label for="selectedCoach"> 2. 導師</label>
                    <div>
                        <div class="sep-bar-10"></div><select id="selectedCoach">
                            <option value="me"> Minnie Soo </option>
                        </select>
                    </div>

                    <div class="sep-bar-10"></div>
                    <label for="paymentmethod"> 3. 上傳比賽影片</label>
                    <div>
                        <div class="sep-bar-10"></div>
                        <input type="file" id="matchVideo" name="matchVideo" accept="video/*" />

                    </div>

                    <div class="sep-bar-10"></div>
                    <label for="questions"> 3. 2-3條想問導師的問題</label>
                    <div>
                        <div class="sep-bar-10"></div>
                        <input type="text" id="questions" name="questions"/>

                    </div>

                    <div class="sep-bar-10"></div>
                    <label for="paymentmethod"> 4. 付款方式</label>
                    <div>
                        <div class="sep-bar-10"></div><select id="paymentmethod">
                            <option value="single"> FPS </option>
                            <option value="set2"> Payme </option>
                            <option value="set3"> Alipay HK</option>
                        </select>
                    </div>

                    <div class="sep-bar-10"></div>
                    <button class="mybtn2" onclick="initOrder(event)"> 購買 </button>
                </form>

            </div>
        </div>

        <script>

            function showPurchaseForm() {
                $('#newPurchaseForm').show();
            }
            // append a new purchase object to purchase array
            function initOrder(e) {
                e.preventDefault()
                const purchase = $('#productname').val(); //**
                var input = document.querySelector('input[type="file"]');
                var data = new FormData();
                data.append('file', input.files[0]);
                data.append('purchase', purchase);

                fetch('/newOrder', {
                    method: "POST",
                    // headers: {
                    //     "Content-type": "multipart/form-data"
                    // },
                    body: data
                }).then((res) => res.json()).then((data) => {
                    if (data.success === true) {
                        alert(data.message);
                    } else {
                        alert("Purchase unsuccessful");
                    }
                }).catch((e) => console.error(e));
            }
        </script>

        <script src="../js/new_navbar.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
            crossorigin="anonymous"></script>


</body>

</html>
